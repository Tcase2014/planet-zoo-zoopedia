<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Planet Zoo Zoopedia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2e8;
      color: #273326;
    }

    header {
      background: #304b32;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      opacity: 0.85;
    }

    .controls {
      max-width: 1150px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .search {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #cbd4c5;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    select {
      padding: 13px;
      border: 1px solid #cbd4c5;
      border-radius: 10px;
      background: white;
      font-size: 15px;
      color: #273326;
    }

    .sort-row {
      margin-top: 12px;
    }

    .animals {
      max-width: 1150px;
      margin: 30px auto;
      padding: 0 20px 50px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
    }

    .animal-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }

    .animal-card:hover {
      transform: translateY(-4px);
    }

    .animal-image {
      height: 180px;
      background: #d8e2d2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 75px;
      overflow: hidden;
    }

    .animal-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .animal-info {
      padding: 15px;
      text-align: center;
    }

    .animal-info h2 {
      margin: 0;
      font-size: 19px;
    }

    .animal-info p {
      margin: 6px 0 0;
      color: #71806d;
      font-size: 13px;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: #71806d;
    }

    @media (max-width: 800px) {
      .filters {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🐾 My Planet Zoo Zoopedia</h1>
    <p>Explore your animals</p>
  </header>

  <div class="controls">

    <input
      type="text"
      id="search"
      class="search"
      placeholder="🔍 Search animals..."
    >

    <div class="filters">

      <select id="classFilter">
        <option value="">Animal Class</option>
        <option value="Mammals">Mammals</option>
        <option value="Birds">Birds</option>
        <option value="Reptiles">Reptiles</option>
        <option value="Amphibians">Amphibians</option>
        <option value="Fish">Fish</option>
        <option value="Invertebrates">Invertebrates</option>
      </select>

      <select id="groupFilter">
        <option value="">Animal Group</option>
        <option value="Big Cats">Big Cats</option>
        <option value="Primates">Primates</option>
        <option value="Hoofstock">Hoofstock</option>
        <option value="Marsupials">Marsupials</option>
        <option value="Rodents">Rodents</option>
        <option value="Raptors">Raptors</option>
        <option value="Waterfowl">Waterfowl</option>
        <option value="Parrots">Parrots</option>
        <option value="Flightless Birds">Flightless Birds</option>
        <option value="Lizards">Lizards</option>
        <option value="Crocodilians">Crocodilians</option>
        <option value="Snakes">Snakes</option>
        <option value="Turtles / Tortoises">Turtles / Tortoises</option>
        <option value="Frogs">Frogs</option>
        <option value="Toads">Toads</option>
        <option value="Salamanders">Salamanders</option>
        <option value="Newts">Newts</option>
        <option value="Insects">Insects</option>
        <option value="Arachnids">Arachnids</option>
        <option value="Crustaceans">Crustaceans</option>
        <option value="Molluscs">Molluscs</option>
      </select>

      <select id="continentFilter">
        <option value="">Continent</option>
        <option value="Africa">Africa</option>
        <option value="Asia">Asia</option>
        <option value="Europe">Europe</option>
        <option value="North America">North America</option>
        <option value="South America">South America</option>
        <option value="Oceania">Oceania</option>
      </select>

      <select id="dietFilter">
        <option value="">Diet</option>
        <option value="Herbivore">Herbivore</option>
        <option value="Carnivore">Carnivore</option>
        <option value="Omnivore">Omnivore</option>
        <option value="Insectivore">Insectivore</option>
        <option value="Piscivore">Piscivore</option>
      </select>

    </div>

    <div class="sort-row">

      <select id="sortFilter">
        <option value="az">Sort: A → Z</option>
        <option value="za">Sort: Z → A</option>
      </select>

    </div>

  </div>

  <main class="animals" id="animalGrid"></main>

  <script>

    /*
      ==========================================================
      YOUR ANIMALS
      ==========================================================

      To add an animal later, copy one of these entries.

      image:
      Leave blank for now if you don't have an image yet.

      continents:
      You can put MORE THAN ONE continent here.

      groups:
      You can also give an animal MORE THAN ONE group if needed.

      diet:
      You can give an animal MORE THAN ONE diet if appropriate.
    */

    const animals = [

      {
        name: "African Lion",
        image: "",
        class: "Mammals",
        groups: ["Big Cats"],
        continents: ["Africa"],
        diet: ["Carnivore"]
      },

      {
        name: "Bengal Tiger",
        image: "",
        class: "Mammals",
        groups: ["Big Cats"],
        continents: ["Asia"],
        diet: ["Carnivore"]
      },

      {
        name: "Leopard",
        image: "",
        class: "Mammals",
        groups: ["Big Cats"],
        continents: ["Africa", "Asia"],
        diet: ["Carnivore"]
      },

      {
        name: "Giraffe",
        image: "",
        class: "Mammals",
        groups: ["Hoofstock"],
        continents: ["Africa"],
        diet: ["Herbivore"]
      },

      {
        name: "Gorilla",
        image: "",
        class: "Mammals",
        groups: ["Primates"],
        continents: ["Africa"],
        diet: ["Herbivore"]
      },

      {
        name: "Red Kangaroo",
        image: "",
        class: "Mammals",
        groups: ["Marsupials"],
        continents: ["Oceania"],
        diet: ["Herbivore"]
      },

      {
        name: "Capybara",
        image: "",
        class: "Mammals",
        groups: ["Rodents"],
        continents: ["South America"],
        diet: ["Herbivore"]
      },

      {
        name: "Bald Eagle",
        image: "",
        class: "Birds",
        groups: ["Raptors"],
        continents: ["North America"],
        diet: ["Carnivore"]
      },

      {
        name: "Macaw",
        image: "",
        class: "Birds",
        groups: ["Parrots"],
        continents: ["South America"],
        diet: ["Herbivore"]
      },

      {
        name: "Komodo Dragon",
        image: "",
        class: "Reptiles",
        groups: ["Lizards"],
        continents: ["Asia"],
        diet: ["Carnivore"]
      },

      {
        name: "American Alligator",
        image: "",
        class: "Reptiles",
        groups: ["Crocodilians"],
        continents: ["North America"],
        diet: ["Carnivore"]
      },

      {
        name: "Green Anaconda",
        image: "",
        class: "Reptiles",
        groups: ["Snakes"],
        continents: ["South America"],
        diet: ["Carnivore"]
      },

      {
        name: "Giant Tortoise",
        image: "",
        class: "Reptiles",
        groups: ["Turtles / Tortoises"],
        continents: ["Africa"],
        diet: ["Herbivore"]
      },

      {
        name: "Red-Eyed Tree Frog",
        image: "",
        class: "Amphibians",
        groups: ["Frogs"],
        continents: ["North America", "South America"],
        diet: ["Insectivore"]
      },

      {
        name: "Giant Stick Insect",
        image: "",
        class: "Invertebrates",
        groups: ["Insects"],
        continents: ["Oceania"],
        diet: ["Herbivore"]
      }

    ];


    const grid = document.getElementById("animalGrid");

    const search = document.getElementById("search");

    const classFilter = document.getElementById("classFilter");

    const groupFilter = document.getElementById("groupFilter");

    const continentFilter = document.getElementById("continentFilter");

    const dietFilter = document.getElementById("dietFilter");

    const sortFilter = document.getElementById("sortFilter");


    function displayAnimals() {

      const searchText = search.value.toLowerCase();

      const selectedClass = classFilter.value;

      const selectedGroup = groupFilter.value;

      const selectedContinent = continentFilter.value;

      const selectedDiet = dietFilter.value;

      const sortOrder = sortFilter.value;


      let filteredAnimals = animals.filter(animal => {

        const matchesSearch =
          animal.name.toLowerCase().includes(searchText);

        const matchesClass =
          !selectedClass || animal.class === selectedClass;

        const matchesGroup =
          !selectedGroup ||
          animal.groups.includes(selectedGroup);

        const matchesContinent =
          !selectedContinent ||
          animal.continents.includes(selectedContinent);

        const matchesDiet =
          !selectedDiet ||
          animal.diet.includes(selectedDiet);


        return (
          matchesSearch &&
          matchesClass &&
          matchesGroup &&
          matchesContinent &&
          matchesDiet
        );

      });


      filteredAnimals.sort((a, b) => {

        return sortOrder === "az"
          ? a.name.localeCompare(b.name)
          : b.name.localeCompare(a.name);

      });


      grid.innerHTML = "";


      if (filteredAnimals.length === 0) {

        grid.innerHTML = `
          <div class="no-results">
            <h2>No animals found</h2>
            <p>Try changing your filters.</p>
          </div>
        `;

        return;

      }


      filteredAnimals.forEach(animal => {

        const card = document.createElement("div");

        card.className = "animal-card";


        const imageContent = animal.image

          ? `<img src="${animal.image}" alt="${animal.name}">`

          : `<span>🐾</span>`;


        card.innerHTML = `

          <div class="animal-image">
            ${imageContent}
          </div>

          <div class="animal-info">

            <h2>${animal.name}</h2>

            <p>
              ${animal.class} • ${animal.groups.join(", ")}
            </p>

          </div>

        `;


        grid.appendChild(card);

      });

    }


    search.addEventListener("input", displayAnimals);

    classFilter.addEventListener("change", displayAnimals);

    groupFilter.addEventListener("change", displayAnimals);

    continentFilter.addEventListener("change", displayAnimals);

    dietFilter.addEventListener("change", displayAnimals);

    sortFilter.addEventListener("change", displayAnimals);


    displayAnimals();

  </script>

</body>
</html>
